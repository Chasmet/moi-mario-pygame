name: Build Godot 4.7 Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  APK_NAME: "Super-CHK-Bros.apk"

jobs:
  build:
    name: Validate and build real Godot APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot 4.7.1 export templates
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"

          if [ -d "/root/.config/godot" ] && [ "$HOME" != "/root" ]; then
            rm -rf "$HOME/.config/godot"
            cp -a "/root/.config/godot" "$HOME/.config/godot"
          fi

          if [ -d "$TEMPLATE_SOURCE" ] && [ "$TEMPLATE_SOURCE" != "$TEMPLATE_TARGET" ]; then
            rm -rf "$TEMPLATE_TARGET"
            cp -a "$TEMPLATE_SOURCE" "$TEMPLATE_TARGET"
          fi

          godot --version
          test -f project.godot
          test -f export_presets.cfg
          test -d "$TEMPLATE_TARGET" || test -d "$TEMPLATE_SOURCE"

      - name: Import and validate scenes and scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --editor --quit --path .

      - name: Export installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$APK_NAME"
          godot --headless --verbose --path . --export-debug "Android" "$PWD/$APK_NAME"
          test -s "$APK_NAME"
          file "$APK_NAME"
          sha256sum "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Super-CHK-Bros-Godot-4.7.1-APK
          path: Super-CHK-Bros.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Super CHK Bros - APK Android Godot 4.7.1
          body: |
            Véritable APK Android exporté avec Godot 4.7.1.
            10 niveaux, commandes tactiles, ennemis PNG, boss, checkpoints et sauvegarde du record.
          files: Super-CHK-Bros.apk
          make_latest: true
          overwrite_files: true
          prerelease: false
