name: Build Godot 4.7 Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-4-7-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_TEMPLATE_DIR: "4.7.stable"
  APK_NAME: "Super-CHK-Bros.apk"

jobs:
  build:
    name: Validate game and build real APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.7

    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot 4.7 environment
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -f project.godot
          test -f export_presets.cfg

          SOURCE_TEMPLATES="/root/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR"
          TARGET_TEMPLATES="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR"

          if [ ! -f "$TARGET_TEMPLATES/android_debug.apk" ]; then
            test -f "$SOURCE_TEMPLATES/android_debug.apk"
            mkdir -p "$TARGET_TEMPLATES"
            cp -a "$SOURCE_TEMPLATES/." "$TARGET_TEMPLATES/"
          fi

          if [ "$HOME" != "/root" ] && [ -d /root/.config/godot ]; then
            mkdir -p "$HOME/.config"
            rm -rf "$HOME/.config/godot"
            cp -a /root/.config/godot "$HOME/.config/godot"
          fi

          test -f "$TARGET_TEMPLATES/android_debug.apk"

      - name: Import resources and validate GDScript
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit

      - name: Export installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$APK_NAME" "$APK_NAME.sha256"
          godot --headless --verbose --path . \
            --export-debug "Android" "$PWD/$APK_NAME"
          test -s "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          file "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Super-CHK-Bros-Godot-4.7-APK
          path: |
            Super-CHK-Bros.apk
            Super-CHK-Bros.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: Super CHK Bros — APK Android Godot 4.7
          body: |
            APK Android directement installable, compilé avec Godot 4.7 stable.
            10 niveaux, commandes tactiles, ennemis PNG, boss, checkpoints et sauvegarde du record.
          files: |
            Super-CHK-Bros.apk
            Super-CHK-Bros.apk.sha256
          make_latest: true
          overwrite_files: true
          prerelease: false
