name: Build Godot 4.7 Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-4-7-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_TEMPLATE_DIR: "4.7.stable"
  APK_NAME: "Super-CHK-Bros.apk"
  GODOT_BIN: ${{ github.workspace }}/.godot-bin/godot

jobs:
  build:
    name: Validate game and build real APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot 4.7 and export templates
        uses: actions/cache@v4
        with:
          path: |
            .godot-bin
            ~/.local/share/godot/export_templates/4.7.stable
          key: godot-4.7-stable-linux-android-templates-v1

      - name: Install official Godot 4.7 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$GODOT_BIN")"
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR"

          if [ ! -x "$GODOT_BIN" ]; then
            curl -fL --retry 4 --retry-delay 3 \
              "https://godot-releases.nbg1.your-objectstorage.com/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip" \
              -o /tmp/godot.zip
            rm -rf /tmp/godot-engine
            mkdir -p /tmp/godot-engine
            unzip -q /tmp/godot.zip -d /tmp/godot-engine
            mv /tmp/godot-engine/Godot_v4.7-stable_linux.x86_64 "$GODOT_BIN"
            chmod +x "$GODOT_BIN"
          fi

          if [ ! -f "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR/android_debug.apk" ]; then
            curl -fL --retry 4 --retry-delay 3 \
              "https://godot-releases.nbg1.your-objectstorage.com/4.7-stable/Godot_v4.7-stable_export_templates.tpz" \
              -o /tmp/export-templates.tpz
            rm -rf /tmp/godot-templates
            mkdir -p /tmp/godot-templates
            unzip -q /tmp/export-templates.tpz -d /tmp/godot-templates
            cp -a /tmp/godot-templates/templates/. \
              "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_DIR/"
          fi

          "$GODOT_BIN" --version
          test -f project.godot
          test -f export_presets.cfg

      - name: Import resources and validate GDScript
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Export installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$APK_NAME" "$APK_NAME.sha256"
          "$GODOT_BIN" --headless --verbose --path . \
            --export-debug "Android" "$PWD/$APK_NAME"
          test -s "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          file "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Super-CHK-Bros-Godot-4.7-APK
          path: |
            Super-CHK-Bros.apk
            Super-CHK-Bros.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: Super CHK Bros — APK Android Godot 4.7
          body: |
            APK Android directement installable, compilé avec Godot 4.7 stable.
            10 niveaux, commandes tactiles, ennemis PNG, boss, checkpoints et sauvegarde du record.
          files: |
            Super-CHK-Bros.apk
            Super-CHK-Bros.apk.sha256
          make_latest: true
          overwrite_files: true
          prerelease: false
