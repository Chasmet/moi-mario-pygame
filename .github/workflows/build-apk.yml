name: Build Godot 4.7 Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  APK_NAME: "Super-CHK-Bros.apk"

jobs:
  build:
    name: Validate, smoke-test and build real Godot APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot 4.7.1 export templates
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_SOURCE="/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"

          if [ -d "/root/.config/godot" ] && [ "$HOME" != "/root" ]; then
            rm -rf "$HOME/.config/godot"
            cp -a "/root/.config/godot" "$HOME/.config/godot"
          fi

          if [ -d "$TEMPLATE_SOURCE" ] && [ "$TEMPLATE_SOURCE" != "$TEMPLATE_TARGET" ]; then
            rm -rf "$TEMPLATE_TARGET"
            cp -a "$TEMPLATE_SOURCE" "$TEMPLATE_TARGET"
          fi

          godot --version
          test -f project.godot
          test -f export_presets.cfg
          test -d "$TEMPLATE_TARGET" || test -d "$TEMPLATE_SOURCE"

      - name: Import and validate scenes and scripts
        shell: bash
        run: |
          set -o pipefail
          rm -f godot-import.log
          godot --headless --verbose --editor --quit --path . 2>&1 | tee godot-import.log
          STATUS=${PIPESTATUS[0]}

          if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load script|Cannot infer the type" godot-import.log; then
            echo "GDScript validation errors detected"
            grep -Ein "SCRIPT ERROR|Parse Error|Failed to load script|Cannot infer the type" godot-import.log || true
            exit 91
          fi
          exit "$STATUS"

      - name: Run gameplay smoke test
        shell: bash
        run: |
          set -o pipefail
          rm -f godot-runtime.log
          godot --headless --verbose --path . --quit-after 180 2>&1 | tee godot-runtime.log
          STATUS=${PIPESTATUS[0]}

          if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Attempt to call|Nonexistent function|on a null instance" godot-runtime.log; then
            echo "Runtime gameplay errors detected"
            grep -Ein "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Attempt to call|Nonexistent function|on a null instance" godot-runtime.log || true
            exit 93
          fi
          exit "$STATUS"

      - name: Export installable Android APK
        shell: bash
        run: |
          set -o pipefail
          rm -f "$APK_NAME" godot-export.log godot-export.status
          godot --headless --verbose --path . --export-debug "Android" "$PWD/$APK_NAME" 2>&1 | tee godot-export.log
          STATUS=${PIPESTATUS[0]}

          if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load script|Cannot infer the type" godot-export.log; then
            STATUS=92
          fi
          if [ "$STATUS" -eq 0 ]; then
            test -s "$APK_NAME" || STATUS=90
          fi

          echo "$STATUS" > godot-export.status
          if [ "$STATUS" -ne 0 ]; then
            echo "Godot Android export failed with status $STATUS"
            grep -Ein "SCRIPT ERROR|Parse Error|Failed to load script|Cannot infer the type" godot-export.log || true
            tail -n 120 godot-export.log || true
            exit "$STATUS"
          fi

          ls -lh "$APK_NAME"
          sha256sum "$APK_NAME"

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Super-CHK-Bros-Godot-4.7.1-build
          path: |
            Super-CHK-Bros.apk
            godot-import.log
            godot-runtime.log
            godot-export.log
            godot-export.status
          if-no-files-found: warn
          retention-days: 30

      - name: Publish direct APK download
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Super CHK Bros - APK Android Godot 4.7.1
          body: |
            Véritable APK Android exporté avec Godot 4.7.1.
            10 niveaux, commandes tactiles, ennemis PNG, boss, checkpoints et sauvegarde du record.
          files: Super-CHK-Bros.apk
          make_latest: true
          overwrite_files: true
          prerelease: false
