name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-android-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  APK_NAME: "Super-CHK-Bros.apk"

jobs:
  build:
    name: Build real Godot APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"

          if [ -d "/root/.config/godot" ]; then
            rm -rf "$HOME/.config/godot"
            cp -a "/root/.config/godot" "$HOME/.config/godot"
          fi

          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            rm -rf "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
            cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
              "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          fi

          godot --version
          test -f project.godot
          test -f export_presets.cfg

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --editor --quit --path .

      - name: Export installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$APK_NAME"
          godot --headless --verbose --path . --export-debug "Android" "$PWD/$APK_NAME"
          test -s "$APK_NAME"
          sha256sum "$APK_NAME"

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Super CHK Bros - APK Android Godot
          body: |
            APK Android Godot directement installable.
            10 niveaux, commandes tactiles, ennemis PNG, boss et sauvegarde du record.
          files: Super-CHK-Bros.apk
          make_latest: true
          overwrite_files: true
          prerelease: false
