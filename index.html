<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#5C94FC">
    <title>Super CHK Bros</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Arial Black', Arial, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game {
            display: block;
            width: 100vw;
            height: auto;
            max-height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #5C94FC;
        }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
            z-index: 50;
            pointer-events: none;
        }
        #controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(16px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-between;
            padding: 0 18px;
            z-index: 100;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .control-btn {
            width: 78px;
            height: 78px;
            border: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(8px);
            color: white;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .control-btn:active, .control-btn.active {
            transform: scale(0.92);
            background: rgba(255, 140, 0, 0.55);
        }
        #jumpBtn {
            font-size: 18px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 80, 0, 0.45);
        }
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: white;
            text-align: center;
        }
        #overlay h1 {
            font-size: 48px;
            margin: 0 0 12px;
            text-shadow: 3px 3px 0 #000;
        }
        #overlay p {
            font-size: 22px;
            margin: 8px 0 24px;
        }
        #overlay button {
            padding: 16px 40px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            background: #ff6600;
            color: white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        @media (max-width: 480px) {
            .control-btn { width: 68px; height: 68px; font-size: 28px; }
            #jumpBtn { width: 78px; height: 78px; font-size: 16px; }
            #ui { font-size: 16px; }
        }
    </style>
</head>
<body>
    <canvas id="game" width="960" height="540"></canvas>

    <div id="ui">
        <div>SCORE <span id="scoreVal">0</span></div>
        <div>VIES <span id="livesVal">3</span></div>
        <div>PIÈCES <span id="coinsVal">0</span></div>
    </div>

    <div id="controls">
        <div class="control-group">
            <button class="control-btn" id="leftBtn">←</button>
            <button class="control-btn" id="rightBtn">→</button>
        </div>
        <div class="control-group">
            <button class="control-btn" id="jumpBtn">SAUT</button>
        </div>
    </div>

    <div id="overlay">
        <h1 id="overlayTitle">GAME OVER</h1>
        <p id="overlayMsg">Score final : 0</p>
        <button id="restartBtn">REJOUER</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
