<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#00A8FF">
    <link rel="manifest" href="manifest.json">
    <title>SUPER CHK BROS</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial Black, Arial, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; }
        #game { display: block; width: 100vw; height: auto; max-height: 100vh; image-rendering: pixelated; }
        #ui { position: fixed; top: 0; left: 0; right: 0; padding: 10px 14px; display: flex; justify-content: space-between; color: #fff; font-size: 18px; text-shadow: 2px 2px 0 #000; z-index: 50; pointer-events: none; }
        #controls { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; padding: 0 16px; z-index: 100; pointer-events: none; }
        .control-group { display: flex; gap: 10px; pointer-events: auto; }
        .control-btn { width: 74px; height: 74px; border: 3px solid rgba(255,255,255,0.35); border-radius: 50%; background: rgba(0,0,0,0.4); color: white; font-size: 28px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .control-btn:active, .control-btn.active { transform: scale(0.92); background: rgba(0,168,255,0.55); }
        #jumpBtn { width: 86px; height: 86px; font-size: 16px; background: rgba(255,92,0,0.5); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; color: white; text-align: center; }
        #overlay h1 { font-size: 42px; margin: 0 0 10px; text-shadow: 3px 3px 0 #000; }
        #overlay p { font-size: 20px; margin: 6px 0 22px; }
        #overlay button { padding: 14px 36px; font-size: 22px; font-weight: bold; border: none; border-radius: 14px; background: #00A8FF; color: white; }
    </style>
</head>
<body>
    <canvas id="game" width="960" height="540"></canvas>
    <div id="ui">
        <div>SCORE <span id="scoreVal">0</span></div>
        <div>VIES <span id="livesVal">3</span></div>
        <div>PIÈCES <span id="coinsVal">0</span></div>
    </div>
    <div id="controls">
        <div class="control-group">
            <button class="control-btn" id="leftBtn">←</button>
            <button class="control-btn" id="rightBtn">→</button>
        </div>
        <div class="control-group">
            <button class="control-btn" id="jumpBtn">SAUT</button>
        </div>
    </div>
    <div id="overlay">
        <h1 id="overlayTitle">GAME OVER</h1>
        <p id="overlayMsg">Score final : 0</p>
        <button id="restartBtn">REJOUER</button>
    </div>
    <script src="game.js"></script>
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script>
</body>
</html>
